<!DOCTYPE html>
<html>

<head>

	<!-- Font Awesome -->
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">

	<!-- Google Font -->

	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700&display=swap" rel="stylesheet">

	<!-------->

	<style>
		* {
			margin: 0;
			padding: 0;
			-webkit-box-sizing: border-box;
			box-sizing: border-box;
		}


		.navMenu {
			font-family: 'Advent Pro', sans-serif;
			padding: 8px;
			text-align: center;
			margin: 7px auto;
			width: fit-content;
		}

		.navMenu a {
			color: #272727;
			text-decoration: none;
			text-transform: uppercase;
			display: inline-block;
			padding: 6px;
		}

		.background {
			background-color: #ece5f0;
		}

		.border {
			border: 1px solid #cccccc;

		}

		.navMenu a:hover {

			color: #d09c0b;
		}
	</style>
</head>

<body>

	<nav class="navMenu  border">
		<a id="home" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-house"></i> Home</a>
		<a id="semana" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-calendar-week"></i> Semana</a>
		<a id="proyectos" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-briefcase"></i> Proyectos</a>
		<a id="tasks" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-list-check"></i> ToDo</a>
		<a id="enarm" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-money-bill-wave"></i> ENARM</a>
		<a id="research" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-lightbulb"></i> Research</a>
		<a id="ejercicio" onclick="navigate(this.id)" href="#"> <i class="fa-solid fa-layer-group"></i> Entrenamiento</a>
	



	</nav>


	<script>

		let direction = "horizontal";
		if (direction === "vertical") {
			document.head.insertAdjacentHTML("beforeend", `<style>.navMenu a {display: block; text-align:left; margin:7px} i{width:15px; margin-right:5px} .navMenu{margin:3px}</style>`)
		}


		function navigate(id) {

			if (id == 'home')
				window.open("https://www.notion.so/Mi-Vida-3765a96b6afa817ca5aec8ccbc22ba14?source=copy_link", '_blank').focus();
			else if (id == "semana")
				window.open("https://example.com", '_blank').focus();
			else if (id == "proyectos")
				window.open("https://example.com", '_blank').focus();
			else if (id == "tasks")
				window.open("https://example.com", '_blank').focus();
			else if (id == "enarm")
				window.open("https://example.com", '_blank').focus();
			else if (id == "research")
				window.open("https://example.com", '_blank').focus();
			else if (id == "ejercicio")
				window.open("https://example.com", '_blank').focus();

		}
	</script>


</body>

</html>
